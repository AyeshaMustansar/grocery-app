<ion-content [fullscreen]="true" class="account-content">
  <div class="main">

  <!-- ===== Top bar: title / search / moon ===== -->
  <div class="top-bar">
    <div class="top-bar-title">Account</div>

    <div class="top-bar-actions">
      <div class="icon-btn">
        <ion-icon name="search-outline" class="icon-search"></ion-icon>
      </div>
      <div class="icon-btn">
        <ion-icon name="moon-outline"></ion-icon>
      </div>
    </div>
  </div>

  <!-- ===== Profile Header ===== -->
  <div class="profile-header">
    <div class="avatar-wrap">
      <div class="profile-avatar img-avatar"></div>
      <div class="avatar-badge">
        <ion-icon name="camera-outline"></ion-icon>
      </div>
    </div>

    <div class="profile-info">
      <div class="profile-name-row">
        <h2 class="profile-name">Afsar Hossen</h2>
        <div class="icon-btn small">
          <ion-icon name="create-outline" class="edit-icon"></ion-icon>
        </div>
      </div>
      <p class="profile-email">imshuvo97&#64;gmail.com</p>
    </div>
  </div>

  <!-- ===== Menu List ===== -->
  <div class="account-list">

    <div class="account-item">
      <div class="item-icon-wrap icon-orders">
        <ion-icon name="bag-handle-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">Orders</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

    <div class="account-item">
      <div class="item-icon-wrap icon-my-details">
        <ion-icon name="card-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">My Details</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

    <div class="account-item">
      <div class="item-icon-wrap icon-delivery">
        <ion-icon name="location-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">Delivery Address</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

    <div class="account-item">
      <div class="item-icon-wrap icon-payment">
        <ion-icon name="card-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">Payment Methods</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

    <div class="account-item">
      <div class="item-icon-wrap icon-promo">
        <ion-icon name="pricetag-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">Promo Card</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

    <div class="account-item">
      <div class="item-icon-wrap icon-notifications">
        <ion-icon name="notifications-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">Notifications</span>
      <span class="item-badge">3</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

    <div class="account-item">
      <div class="item-icon-wrap icon-help">
        <ion-icon name="help-circle-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">Help</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

    <div class="account-item">
      <div class="item-icon-wrap icon-about">
        <ion-icon name="information-circle-outline" class="item-icon"></ion-icon>
      </div>
      <span class="item-label">About</span>
      <ion-icon name="chevron-forward-outline" class="chevron-icon"></ion-icon>
    </div>

  </div>

  <!-- ===== Logout ===== -->
  <div class="logout-wrapper">
    <ion-button expand="block" fill="clear" class="logout-btn">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      Log Out
    </ion-button>
  </div>
  </div>
</ion-content>
