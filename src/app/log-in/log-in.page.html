<ion-content [fullscreen]="true" class="login-content">
  <div class="main">
    <div class="bg-blur"></div>

    <div class="login-wrapper-outer">
      <div class="login-wrapper">

        <!-- Brand Logo Badge -->
        <div class="logo-badge">
          <img
            class="logo-badge-img"
            src="../../assets/Group.png"
            alt="Fresh Market Logo"
          />
        </div>

        <!-- Header Block -->
        <div class="header-block">
          <div class="title">Loging</div>
          <p class="subtitle">Enter your emails and password</p>
        </div>

        <!-- Email Input Field -->
        <div class="input-group">
          <input
            type="email"
            id="email"
            placeholder=" "
            [(ngModel)]="email"
            autocomplete="email"
          />
          <label for="email">Email</label>
        </div>

        <!-- Password Input Field -->
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            placeholder=" "
            [(ngModel)]="password"
            autocomplete="current-password"
          />

          <label for="password">Password</label>

          <button
            type="button"
            class="password-toggle-icon"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <ion-icon
              [name]="showPassword ? 'eye-outline' : 'eye-off-outline'"
            ></ion-icon>
          </button>
        </div>

        <!-- Forgot Password Row -->
        <div class="forgot-row">
          <a class="forgot-link">Forgot Password?</a>
        </div>

        <!-- Log In Button -->
<ion-button
  expand="block"
  class="login-btn"
  [disabled]="isLoading || isLockedOut"
  (click)="goToHome()">
  <span *ngIf="isLockedOut">Try again in {{ lockoutSeconds }}s</span>
  <span *ngIf="!isLockedOut && isLoading">Checking...</span>
  <span *ngIf="!isLockedOut && !isLoading">Log In</span>
</ion-button>

        <!-- Signup Prompt -->
        <p class="signup-row">
          Don't have an account?
          <a class="signup-link" (click)="goToSignUp()">Signup</a>
        </p>

      </div>
    </div>
  </div>
</ion-content>
