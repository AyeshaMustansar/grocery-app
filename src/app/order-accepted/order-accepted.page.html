<ion-content [fullscreen]="true" class="order-content">

  <div class="page-title">Order Accepted</div>

  <div class="success-wrap">

    <!-- ===== Confetti / decorative shapes ===== -->
    <div class="confetti-field">
      <span class="confetti dot green" style="top: 6%; left: 34%;"></span>
      <span class="confetti dot red" style="top: 2%; left: 54%;"></span>

      <svg class="confetti squiggle orange" style="top: 8%; right: 6%;" width="34" height="46" viewBox="0 0 34 46" fill="none">
        <path d="M4 2C4 2 26 10 12 20C-2 30 30 30 30 44" stroke="#ff9f43" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <span class="confetti ring yellow" style="top: 30%; left: 12%;"></span>
      <span class="confetti ring purple" style="top: 38%; right: 10%;"></span>

      <svg class="confetti squiggle blue" style="top: 56%; left: 4%;" width="46" height="34" viewBox="0 0 46 34" fill="none">
        <path d="M2 4C2 4 10 26 20 12C30 -2 30 30 44 30" stroke="#4d96ff" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <span class="confetti ring green" style="bottom: 10%; left: 30%;"></span>
      <span class="confetti dot blue" style="bottom: 6%; left: 48%;"></span>

      <svg class="confetti squiggle gold" style="bottom: 8%; right: 12%;" width="34" height="30" viewBox="0 0 34 30" fill="none">
        <path d="M2 4C10 4 6 22 16 20C26 18 24 4 32 4" stroke="#f0a500" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- ===== Success circle + checkmark ===== -->
    <div class="check-circle">
      <svg viewBox="0 0 100 100" class="check-svg">
        <circle cx="50" cy="50" r="46" class="circle-ring"></circle>
        <path
          class="check-path drawn"
          d="M28 52 L43 66 L74 34"
        ></path>
      </svg>
    </div>

    <!-- ===== Text ===== -->
    <div class="success-text">
      <h1>Your Order has been accepted</h1>
      <p>Your items has been placed and is on it's way to being processed</p>
    </div>

    <!-- ===== Actions ===== -->
    <div class="success-actions">
      <ion-button expand="block" class="track-btn">
        Track Order
      </ion-button>

      <div class="back-home">
        Back to home
      </div>
    </div>

  </div>

</ion-content>
