<ion-content [fullscreen]="true" class="onboarding-content">
  <div class="bg-image">
    <div class="bg-overlay"></div>
  </div>

  <div class="onboarding-wrapper">

    <div class="icon-badge">
      <img src="../../assets/Group (1).png" alt="carrot" />
    </div>

    <div class="text-block">
      <div class="title">Welcome<br>to our store</div>
      <p class="subtitle">Get your groceries in as fast as one hour</p>
    </div>

    <ion-button expand="block" shape="round" class="get-started-btn" >
      Get Started
    </ion-button>

  </div>
</ion-content>
